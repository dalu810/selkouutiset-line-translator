<!doctype html>
<html>
  <head>
    <style>
      body {
        margin: 0;
        padding: 10px;
        background: transparent; /* ✅ transparent background */
        font-family: sans-serif;
      }

      .container {
        backdrop-filter: blur(8px);
        background: rgba(255, 255, 255, 0.7); /* glass effect */
        border-radius: 10px;
        padding: 12px;
        width: 180px;
      }

      label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        cursor: pointer;
      }

      input[type="checkbox"] {
        transform: scale(1.2);
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <label>
        <input type="checkbox" id="toggle" />
        Line Translation
      </label>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
